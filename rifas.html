<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catálogo de Rifas — Vagner Sorteios</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#1c1d1f; --card:#26282c; --border:#36383e; --title:#eaeaef; --text:#aaaaaa; --primary:#008b77; --paid:#00db87; --danger:#ff4d4d; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
    header { padding: 18px 16px; border-bottom:1px solid var(--border); background:#151617; }
    header .top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    header h1 { color: var(--title); font-size:20px; font-weight:800; }
    header p { font-size:12px; margin-top:4px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:10px 14px; font-weight:800; font-size:13px; cursor:pointer; text-decoration:none; color:#fff; }
    .btn-primary { background:linear-gradient(135deg,var(--primary),#00db87); }
    .btn-danger { background:var(--danger); }
    .btn-ghost { background:var(--card); border:1px solid var(--border); color:var(--title); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 18px 16px 48px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card { background: var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; transition: transform .2s, border-color .2s; color:inherit; display:flex; flex-direction:column; position:relative; }
    .card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .card a.main { text-decoration:none; color:inherit; display:flex; flex-direction:column; flex:1; }
    .card img { width:100%; aspect-ratio: 16/9; object-fit:cover; background:#111; }
    .card .body { padding:14px; flex:1; display:flex; flex-direction:column; gap:8px; }
    .card h2 { color: var(--title); font-size:16px; font-weight:800; line-height:1.3; }
    .price { color: var(--paid); font-weight:800; font-size:14px; }
    .badge { display:inline-block; font-size:10px; font-weight:800; padding:4px 8px; border-radius:999px; text-transform:uppercase; width:fit-content; }
    .badge.active { background:rgba(0,219,135,.15); color:var(--paid); }
    .badge.paused { background:rgba(255,170,0,.15); color:#ffaa00; }
    .badge.closed { background:rgba(255,77,77,.15); color:#ff4d4d; }
    .card .actions { display:flex; gap:8px; padding:0 14px 14px; }
    .card .actions button { flex:1; padding:8px; font-size:12px; border-radius:8px; border:1px solid var(--border); background:#1c1d1f; color:var(--title); cursor:pointer; font-weight:700; }
    .card .actions button.del { color:var(--danger); border-color:rgba(255,77,77,.4); }
    .empty, .loading { text-align:center; padding:40px 16px; color:var(--text); line-height:1.5; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    footer { text-align:center; font-size:12px; padding:16px; opacity:.7; }
    dialog { border:1px solid var(--border); border-radius:14px; background:var(--card); color:var(--title); padding:0; width:min(420px,92vw); }
    dialog::backdrop { background:rgba(0,0,0,.65); }
    dialog .dbody { padding:18px; }
    dialog h3 { margin-bottom:10px; font-size:16px; }
    dialog label { display:block; font-size:12px; margin:10px 0 4px; color:var(--text); }
    dialog input, dialog select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#1c1d1f; color:var(--title); font-size:14px; }
    dialog .row { display:flex; gap:8px; margin-top:16px; }
    dialog .row button { flex:1; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <h1>Catálogo de Rifas</h1>
        <p>Escolha uma campanha ou crie uma nova</p>
      </div>
      <a class="btn btn-ghost" href="./">← Início</a>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <button type="button" class="btn btn-primary" id="btn-nova">+ Nova rifa</button>
      <button type="button" class="btn btn-ghost" id="btn-reload">Atualizar</button>
    </div>
    <div id="grid" class="grid"><div class="loading">Carregando catálogo…</div></div>
  </div>
  <footer>© 2026 Vagner Sorteios</footer>

  <dialog id="dlg-nova">
    <div class="dbody">
      <h3>Criar nova rifa</h3>
      <p style="font-size:12px;color:var(--text);line-height:1.4;">Cria um espaço no Firebase e adiciona ao catálogo. Depois abra e configure no admin.</p>
      <label>Nome / título</label>
      <input id="nova-titulo" placeholder="Ex: Rifa do Anthony" maxlength="80" />
      <label>ID da rifa (sem espaços)</label>
      <input id="nova-id" placeholder="ex: anthony-ravi" maxlength="40" />
      <label>Valor da cota (R$)</label>
      <input id="nova-valor" type="number" min="0" step="0.01" value="5" />
      <div class="row">
        <button type="button" class="btn btn-ghost" id="nova-cancel">Cancelar</button>
        <button type="button" class="btn btn-primary" id="nova-ok">Criar</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfiZPr24kg4O04VFYh6SXdHE257N6Xwng",
      authDomain: "vagner-34d5b.firebaseapp.com",
      databaseURL: "https://vagner-34d5b.firebaseio.com",
      projectId: "vagner-34d5b",
      storageBucket: "vagner-34d5b.firebasestorage.app",
      messagingSenderId: "711539772164",
      appId: "1:711539772164:web:e5c0457cb69f8e7d0bde51"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const grid = document.getElementById("grid");
    const dlg = document.getElementById("dlg-nova");

    function slugify(s){
      return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
        .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || ("rifa-"+Date.now().toString(36));
    }

    function buildUrl(it){
      const origin = location.origin;
      const path = location.pathname.replace(/rifas\.html$/i, "index.html").replace(/\/$/, "/index.html");
      // if path still ends weird, force index
      let base = origin + (path.includes("index.html") ? path : (location.pathname.replace(/[^/]+$/,"") + "index.html"));
      if (base.endsWith("/index.html/index.html")) base = origin + "/index.html";
      const tenant = it.tenant || "rifa_master";
      const rifa = it.rifa || it.id || "padrao";
      if (tenant === "rifa_master" && (rifa === "padrao" || rifa === "rifa_master")) {
        return origin + "/" ; // main
      }
      // multi rifa via query
      return origin + "/?tenant=" + encodeURIComponent(tenant) + "&rifa=" + encodeURIComponent(rifa);
    }

    function cardHtml(it, key){
      const st = it.status || "active";
      const badge = st === "active" ? "active" : st === "paused" ? "paused" : "closed";
      const badgeTxt = st === "active" ? "Ativa" : st === "paused" ? "Pausada" : "Encerrada";
      const price = Number(it.valor||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
      const href = (it.url && String(it.url).startsWith("http")) ? it.url : buildUrl(it);
      const img = it.capa || "https://placehold.co/600x340/1c1d1f/aaaaaa?text=Rifa";
      const title = (it.titulo||"Rifa").replace(/</g,"&lt;");
      const id = key || it.id || "";
      return `<div class="card" data-key="${id}">
        <a class="main" href="${href}">
          <img src="${img}" alt="" loading="lazy" onerror="this.src='https://placehold.co/600x340/1c1d1f/aaaaaa?text=Rifa'"/>
          <div class="body">
            <span class="badge ${badge}">${badgeTxt}</span>
            <h2>${title}</h2>
            <div class="price">${price}</div>
          </div>
        </a>
        <div class="actions">
          <button type="button" class="open" data-href="${href}">Abrir</button>
          <button type="button" class="del" data-key="${id}">Excluir</button>
        </div>
      </div>`;
    }

    async function load(){
      grid.innerHTML = '<div class="loading">Carregando…</div>';
      try {
        const snap = await get(ref(db, "rifa_catalog"));
        if (!snap.exists()) {
          grid.innerHTML = '<div class="empty">Nenhuma rifa no catálogo.<br><small>Use “+ Nova rifa” ou publique pelo admin.</small></div>';
          return;
        }
        const val = snap.val() || {};
        const entries = Object.entries(val).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
        if (!entries.length) {
          grid.innerHTML = '<div class="empty">Catálogo vazio.</div>';
          return;
        }
        grid.innerHTML = entries.map(([k,it]) => cardHtml({...it,id:it.id||k}, k)).join("");
        grid.querySelectorAll("button.open").forEach(btn => {
          btn.onclick = () => { location.href = btn.getAttribute("data-href"); };
        });
        grid.querySelectorAll("button.del").forEach(btn => {
          btn.onclick = async () => {
            const key = btn.getAttribute("data-key");
            if (!key) return;
            if (!confirm("Remover \""+key+"\" do catálogo?\\n(Não apaga os dados da rifa no Firebase, só a listagem.)")) return;
            try {
              await remove(ref(db, "rifa_catalog/"+key));
              load();
            } catch (e) {
              alert("Erro ao excluir: " + (e.message||e));
            }
          };
        });
      } catch (e) {
        console.error(e);
        grid.innerHTML = '<div class="empty">Erro ao carregar catálogo.<br><code>'+String(e.message||e)+'</code></div>';
      }
    }

    document.getElementById("btn-reload").onclick = load;
    document.getElementById("btn-nova").onclick = () => {
      document.getElementById("nova-titulo").value = "";
      document.getElementById("nova-id").value = "";
      document.getElementById("nova-valor").value = "5";
      dlg.showModal();
    };
    document.getElementById("nova-cancel").onclick = () => dlg.close();
    document.getElementById("nova-titulo").addEventListener("input", e => {
      const idEl = document.getElementById("nova-id");
      if (!idEl.dataset.touched) idEl.value = slugify(e.target.value);
    });
    document.getElementById("nova-id").addEventListener("input", () => {
      document.getElementById("nova-id").dataset.touched = "1";
    });

    document.getElementById("nova-ok").onclick = async () => {
      const titulo = document.getElementById("nova-titulo").value.trim() || "Nova Rifa";
      let rid = slugify(document.getElementById("nova-id").value || titulo);
      const valor = parseFloat(document.getElementById("nova-valor").value) || 0;
      const tenant = "rifa_master";
      // store under tenants path for non-default ids
      const isDefault = rid === "padrao";
      const dbPath = isDefault ? "rifa_master" : `tenants/${tenant}/rifas/${rid}`;
      const key = isDefault ? "padrao" : `${tenant}_${rid}`.replace(/[^\w-]/g,"_");
      const item = {
        id: key,
        tenant,
        rifa: rid,
        titulo,
        valor,
        capa: "",
        status: "active",
        updatedAt: Date.now(),
        url: location.origin + "/?tenant=" + encodeURIComponent(tenant) + "&rifa=" + encodeURIComponent(rid)
      };
      try {
        // seed minimal config if missing
        const cfgRef = ref(db, dbPath + "/config");
        const snap = await get(cfgRef);
        if (!snap.exists()) {
          await set(cfgRef, {
            premio: titulo,
            valor: valor,
            total: 1000,
            statusCampanha: "active",
            descricao: "",
            pin: "1234"
          });
        }
        await set(ref(db, "rifa_catalog/" + key), item);
        dlg.close();
        alert("Rifa criada!\\nID: " + rid + "\\nPIN inicial: 1234 (troque no admin)");
        location.href = item.url;
      } catch (e) {
        console.error(e);
        alert("Falha ao criar: " + (e.message||e) + "\\n\\nConfira as rules do Firebase (rifa_catalog e tenants).");
      }
    };

    load();
  </script>
</body>
</html>
